openapi: 3.0.3
info:
  title: SALESTORM Member 3 REST Contract
  version: 1.0.0
  description: Design contract; routes are proposed and not deployed. Internal operations
    require service identity. One SKU/unit per checkout.
servers:
- url: http://localhost:3000
  description: Local mock/demo only; deployed systems use HTTPS
paths:
