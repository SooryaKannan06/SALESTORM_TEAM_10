components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id:
          type: string
          format: uuid
        retryable:
          type: boolean
      required:
      - code
      - message
      - correlation_id
      - retryable
      example:
        code: OUT_OF_STOCK
        message: No unit available for reservation.
        correlation_id: 11111111-1111-4111-8111-111111111111
        retryable: false
    Address:
      type: object
      additionalProperties: false
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
      required:
      - street
      - city
      - state
      - postal_code
      - country
    PurchaseItem:
      type: object
      additionalProperties: false
      properties:
        sku: &id001
          type: string
          minLength: 1
        quantity: &id002
          type: integer
          enum:
          - 1
      required:
      - sku
      - quantity
      example:
        sku: FLASH-001
        quantity: 1
    PricedItem:
      type: object
      additionalProperties: false
      properties:
        sku: *id001
        quantity: *id002
        unit_price_minor:
          type: integer
          format: int64
          minimum: 1
      required:
      - sku
      - quantity
      - unit_price_minor
    CheckoutRequest:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseItem'
          minItems: 1
          maxItems: 1
        payment_token:
          type: string
          minLength: 1
        delivery_address:
          $ref: '#/components/schemas/Address'
      required:
      - items
      - payment_token
      - delivery_address
      example:
        items:
        - sku: FLASH-001
          quantity: 1
        payment_token: mock_token_success
        delivery_address: &id003
          street: 12 Example Street
          city: Coimbatore
          state: Tamil Nadu
          postal_code: '641001'
          country: IN
    Checkout:
      type: object
      additionalProperties: false
      properties:
        checkout_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - INITIATED
          - RESERVING_INVENTORY
          - INVENTORY_RESERVED
          - PROCESSING_PAYMENT
          - AWAITING_PAYMENT_ACTION
          - PAYMENT_UNKNOWN
          - COMMITTING_INVENTORY
          - SUCCESS
          - FAILED_OUT_OF_STOCK
          - FAILED_PAYMENT_DECLINED
          - REFUND_PENDING
          - REFUNDED
        reservation_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        next_action_url:
          type: string
          format: uri
      required:
      - checkout_id
      - status
      - amount_minor
      - currency
      example:
        checkout_id: 11111111-1111-4111-8111-111111111111
        status: SUCCESS
        reservation_id: 22222222-2222-4222-8222-222222222222
        payment_id: 33333333-3333-4333-8333-333333333333
        amount_minor: 99900
        currency: INR
    ReserveRequest:
      type: object
      additionalProperties: false
      properties:
        checkout_id:
          type: string
          format: uuid
        sku:
          type: string
        quantity:
          type: integer
          enum:
          - 1
      required:
      - checkout_id
      - sku
      - quantity
      example:
        checkout_id: 11111111-1111-4111-8111-111111111111
        sku: FLASH-001
        quantity: 1
    Reservation:
      type: object
      additionalProperties: false
      properties:
        reservation_id:
          type: string
          format: uuid
        checkout_id:
          type: string
          format: uuid
        sku:
          type: string
        quantity:
          type: integer
          enum:
          - 1
        status:
          type: string
          enum:
          - HELD
          - COMMITTED
          - RELEASED
          - EXPIRED
        expires_at:
          type: string
          format: date-time
        payment_id:
          type: string
          format: uuid
      required:
      - reservation_id
      - checkout_id
      - sku
      - quantity
      - status
      - expires_at
      example:
        reservation_id: 22222222-2222-4222-8222-222222222222
        checkout_id: 11111111-1111-4111-8111-111111111111
        sku: FLASH-001
        quantity: 1
        status: HELD
        expires_at: '2026-10-05T06:45:00Z'
    CommitRequest:
      type: object
      additionalProperties: false
      properties:
        checkout_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
      required:
      - checkout_id
      - payment_id
      example:
        checkout_id: 11111111-1111-4111-8111-111111111111
        payment_id: 33333333-3333-4333-8333-333333333333
    ReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        checkout_id:
          type: string
          format: uuid
        reason:
          type: string
          enum:
          - PAYMENT_DECLINED
          - CUSTOMER_CANCELLED
      required:
      - checkout_id
      - reason
      example:
        checkout_id: 11111111-1111-4111-8111-111111111111
        reason: PAYMENT_DECLINED
    PaymentRequest:
      type: object
      additionalProperties: false
      properties:
        checkout_id:
          type: string
          format: uuid
        reservation_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        payment_token:
          type: string
          minLength: 1
      required:
      - checkout_id
      - reservation_id
      - amount_minor
      - currency
      - payment_token
      example:
        checkout_id: 11111111-1111-4111-8111-111111111111
        reservation_id: 22222222-2222-4222-8222-222222222222
        amount_minor: 99900
        currency: INR
        payment_token: mock_token_success
    Payment:
      type: object
      additionalProperties: false
      properties:
        payment_id:
          type: string
          format: uuid
        checkout_id:
          type: string
          format: uuid
        reservation_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - INITIATED
          - PENDING_3DS
          - AUTHORIZED
          - CAPTURED
          - UNKNOWN
          - DECLINED
          - FAILED
          - REFUNDED
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        provider_reference:
          type: string
        next_action_url:
          type: string
          format: uri
      required:
      - payment_id
      - checkout_id
      - reservation_id
      - status
      - amount_minor
      - currency
      example:
        payment_id: 33333333-3333-4333-8333-333333333333
        checkout_id: 11111111-1111-4111-8111-111111111111
        reservation_id: 22222222-2222-4222-8222-222222222222
        status: CAPTURED
        amount_minor: 99900
        currency: INR
        provider_reference: mock_charge_001
    RefundRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
          - RESERVATION_EXPIRED
          - RESERVATION_RELEASED
      required:
      - reason
      example:
        reason: RESERVATION_EXPIRED
    Refund:
      type: object
      additionalProperties: false
      properties:
        refund_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - UNKNOWN
          - SUCCEEDED
          - FAILED
        amount_minor:
          type: integer
          format: int64
          minimum: 1
      required:
      - refund_id
      - payment_id
      - status
      - amount_minor
      example:
        refund_id: 66666666-6666-4666-8666-666666666666
        payment_id: 33333333-3333-4333-8333-333333333333
        status: PENDING
        amount_minor: 99900
    Webhook:
      type: object
      additionalProperties: false
      properties:
        provider_event_id:
          type: string
        payment_id:
          type: string
          format: uuid
        provider_reference:
          type: string
        status:
          type: string
          enum:
          - AUTHORIZED
          - CAPTURED
          - DECLINED
          - FAILED
          - REFUNDED
        occurred_at:
          type: string
          format: date-time
      required:
      - provider_event_id
      - payment_id
      - provider_reference
      - status
      - occurred_at
      example:
        provider_event_id: mock_evt_001
        payment_id: 33333333-3333-4333-8333-333333333333
        provider_reference: mock_charge_001
        status: CAPTURED
        occurred_at: '2026-10-05T06:40:10Z'
    Ack:
      type: object
      additionalProperties: false
      properties:
        accepted:
          type: boolean
      required:
      - accepted
      example:
        accepted: true
    Order:
      type: object
      additionalProperties: false
      properties:
        order_id:
          type: string
          format: uuid
        checkout_id:
          type: string
          format: uuid
        customer_id:
          type: string
        reservation_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CONFIRMED
          - PROCESSING
          - SHIPPED
          - OUT_FOR_DELIVERY
          - DELIVERED
          - CANCELLED
          - REFUNDED
        items:
          type: array
          items:
            $ref: '#/components/schemas/PricedItem'
          minItems: 1
          maxItems: 1
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        delivery_address:
          $ref: '#/components/schemas/Address'
      required:
      - order_id
      - checkout_id
      - customer_id
      - reservation_id
      - payment_id
      - status
      - items
      - amount_minor
      - currency
      - delivery_address
      example:
        order_id: 44444444-4444-4444-8444-444444444444
        checkout_id: 11111111-1111-4111-8111-111111111111
        customer_id: demo-customer-001
        reservation_id: 22222222-2222-4222-8222-222222222222
        payment_id: 33333333-3333-4333-8333-333333333333
        status: CONFIRMED
        items:
        - sku: FLASH-001
          quantity: 1
          unit_price_minor: 99900
        amount_minor: 99900
        currency: INR
        delivery_address: *id003
    Product:
      type: object
      additionalProperties: false
      properties:
        sku:
          type: string
        name:
          type: string
        unit_price_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        availability_hint:
          type: string
          enum:
          - AVAILABLE
          - LIMITED
          - OUT_OF_STOCK
          - UNKNOWN
      required:
      - sku
      - name
      - unit_price_minor
      - currency
      - availability_hint
      example:
        sku: FLASH-001
        name: Flash-sale product
        unit_price_minor: 99900
        currency: INR
        availability_hint: LIMITED
    ProductList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
      required:
      - items
      example:
        items:
        - sku: FLASH-001
          name: Flash-sale product
          unit_price_minor: 99900
          currency: INR
          availability_hint: LIMITED
    Cart:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseItem'
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - version
      example:
        items:
        - sku: FLASH-001
          quantity: 1
        version: 1
    Tracking:
      type: object
      additionalProperties: false
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - SHIPPED
          - OUT_FOR_DELIVERY
          - DELIVERED
        carrier:
          type: string
        tracking_number:
          type: string
      required:
      - order_id
      - status
      example:
        order_id: 44444444-4444-4444-8444-444444444444
        status: PENDING
  securitySchemes:
    CustomerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ServiceBearer:
      type: http
      scheme: bearer
      description: Service-scoped token; operation authorization enforced by owner.
    WebhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: Provider signature over raw bytes and timestamp; not a static shared
        API token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Stable per caller/operation; same key with changed request returns
        409.
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Gateway assigns one if absent; propagated through events.
