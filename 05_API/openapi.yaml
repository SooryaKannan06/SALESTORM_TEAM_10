      operationId: startCheckout
      summary: Accepted checkout; poll status. SUCCESS still allows order creation
        pending. Customer identity and prices are derived server-side.
      description: Accepted checkout; poll status. SUCCESS still allows order creation
        pending. Customer identity and prices are derived server-side.
      security:
      - CustomerBearer: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Accepted checkout; poll status. SUCCESS still allows order
            creation pending. Customer identity and prices are derived server-side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
